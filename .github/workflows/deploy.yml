name: Deploy to Firebase Hosting on merge or PR
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './3. code/latte-factor/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./3. code/latte-factor

      - name: Run linter
        run: npm run lint
        working-directory: ./3. code/latte-factor

      - name: Run tests
        run: npm run test
        working-directory: ./3. code/latte-factor

      - name: Build project
        run: npm run build
        working-directory: ./3. code/latte-factor

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: late-factor
